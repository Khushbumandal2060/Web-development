<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS variables</title>
    <style>
        :root{
            --color: blue;
            --seccolor: rgb(228, 134, 119);
        }

        *{
            margin: 0;
            padding: 0;
        }
        .nav{
            background-color: var(--seccolor);
        }

        ul{
            display: flex;
        }

        ul li{
            list-style-type: none;
            padding:34px ;
        }

        ul li:first-child{
            --color: rgb(243, 87, 8);
            background-color: var(--color);
        }

        .container{
            background-color: rgb(179, 223, 177);
        }
    </style>
</head>

<body>
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="container">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Maiores odio eaque corporis placeat minus obcaecati
        nam eius ex illum assumenda eligendi nisi aliquid quas ut consequuntur, inventore architecto perferendis rerum!
    </div>
</body>

</html>
