<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #888888;
        }

        .text-element {
            text-shadow: 2px 2px 4px #ed1717;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>

    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Veritatis aut doloremque amet qui nemo, dolore
        obcaecati earum laboriosam quasi, ut voluptatum aspernatur? Quidem deserunt adipisci fuga nemo dolores provident
        ullam ducimus quasi ut magnam!
    </p>
   
</body>

</html>
