<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: aqua;
        }

        /* The specificity of this selector is 1 + 10 = 11  */
        .yellow{
            color: yellow;
        }

        /* This is an example of sttribute selector. The specificity of this selector 10 */
        [data-x=a]{
            color: maroon;
        }  
        
        /* The specificity of this selector is 10 */
        .cred{
            color: red;
        }

        /* The specificity of this selector is 10 */
        .cpurple{
            color: purple;

        }
    </style>
</head>
<body>
    <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
</body>
</html>
